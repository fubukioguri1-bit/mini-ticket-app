<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>簡易チケット管理</title>
</head>
<body>
  <h1>簡易チケット管理</h1>

  <form id="create-form">
    <input type="text" id="title" name="title" placeholder="件名" required maxlength="100">
    <input type="text" id="assignee" name="assignee" placeholder="担当者" required maxlength="50">
    <select id="priority" name="priority">
      <option value="LOW" selected>LOW</option>
      <option value="MEDIUM">MEDIUM</option>
      <option value="HIGH">HIGH</option>
    </select>
    <button type="submit">登録</button>
  </form>
  <div id="error-msg" style="color: red;"></div>

  <p>
    絞り込み:
    <a href="/">すべて</a> |
    <a href="/?status=TODO">TODO</a> |
    <a href="/?status=DOING">DOING</a> |
    <a href="/?status=DONE">DONE</a>
  </p>

  <table border="1">
    <thead>
      <tr>
        <th>ID</th>
        <th>件名</th>
        <th>担当者</th>
        <th>優先度</th>
        <th>ステータス</th>
        <th>操作</th>
      </tr>
    </thead>
    <tbody>
      {% for t in tickets %}
      <tr>
        <td>{{ t.id }}</td>
        <td>{{ t.title }}</td>
        <td>{{ t.assignee }}</td>
        <td>{{ t.priority }}</td>
        <td>
          <select class="status-select" data-ticket-id="{{ t.id }}">
            <option value="TODO" {% if t.status == 'TODO' %}selected{% endif %}>TODO</option>
            <option value="DOING" {% if t.status == 'DOING' %}selected{% endif %}>DOING</option>
            <option value="DONE" {% if t.status == 'DONE' %}selected{% endif %}>DONE</option>
          </select>
        </td>
        <td>
          <button
            type="button"
            class="delete-btn"
            data-ticket-id="{{ t.id }}"
            {% if t.priority == 'HIGH' %}disabled title="HIGH優先度のチケットは削除できません"{% endif %}
          >削除</button>
        </td>
      </tr>
      {% endfor %}
    </tbody>
  </table>

  <script src="/static/app.js"></script>
</body>
</html>
